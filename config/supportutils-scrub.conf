# Configuration file for supportutils-scrub
# This configuration controls the behavior of supportutils-scrub, which is designed to
# sanitize and remove sensitive data from SUSE supportconfig tarballs.
#
# For full documentation, see the supportutils-scrub(8) and supportutils-scrub.conf(5) man pages.
#
# Boolean options accept yes/no, true/false, on/off or 1/0 (any case).
# An unrecognised value is reported and the option keeps its default.
# A comment may follow a value after whitespace: "obfuscate_mac = yes  # note".

#
# OBFUSCATION SETTINGS
#

# Obfuscate private IP addresses (IPv4 RFC1918 10/8, 172.16/12, 192.168/16,
# plus IPv6 ULA fc00::/7 and link-local fe80::/10).
# Default: no — private addresses are left intact unless you set this to yes.
obfuscate_private_ip = no

# Obfuscate public IP addresses (all IPs except private ranges)
obfuscate_public_ip = yes

# Obfuscate domain names
obfuscate_domain = yes

# Obfuscate usernames
obfuscate_username = yes

# Obfuscate hostnames
obfuscate_hostname = yes

# Obfuscate IPv6 addresses
obfuscate_ipv6 = yes

# Obfuscate MAC addresses
obfuscate_mac = yes

# Obfuscate hardware serial numbers and system UUIDs (dmidecode output)
obfuscate_serial = yes

# Hostnames that must never be obfuscated (comma-separated).
# Extends the built-in preserve set (localhost, product-default container
# names like uyuni-server); built-ins cannot be removed.
# hostname_preserve = build-host,repo-mirror


#
# CUSTOM KEYWORDS
#

# Enable keyword obfuscation from file
use_key_words_file = yes

# Path to file containing additional keywords to obfuscate
# Each keyword should be on its own line
key_words_file = /var/lib/supportutils-scrub-keywords.txt


#
# SECURITY SETTINGS
#

# Extract archives to /dev/shm (tmpfs) to prevent sensitive data touching persistent storage.
# Falls back to /var/tmp if /dev/shm is not available.
secure_tmp = no

# Encrypt the obfuscation mapping file with a passphrase (requires 'cryptography' package).
# When enabled, the mapping file is saved as *.json.enc and cannot be read without the passphrase.
encrypt_mappings = no

# Directory for mapping files, audit logs, and reports.
# Default: /var/tmp
# dataset_dir = /var/tmp
